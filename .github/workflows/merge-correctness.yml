name: ROOT RNTuple independent invariant recheck
on:
  workflow_dispatch:
  push:
    paths:
      - 'validation/**'
      - '.github/workflows/merge-correctness.yml'
permissions:
  contents: read
jobs:
  invariant-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install released ROOT binary
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: ROOT
          python -c 'import ROOT; print("ROOT VERSION",ROOT.gROOT.GetVersion())'
      - name: Compile native RNTuple merger matrix
        shell: bash
        run: |
          set -euo pipefail
          ROOT_HOME="$(python -c 'import ROOT; from pathlib import Path; print(Path(ROOT.__file__).resolve().parent)')"
          ROOT_LIBDIR="$ROOT_HOME/lib"
          ROOT_VENDOR_LIBDIR="$ROOT_HOME/../root.libs"
          export PATH="$ROOT_HOME/bin:$PATH"
          echo "LD_LIBRARY_PATH=$ROOT_LIBDIR:$ROOT_VENDOR_LIBDIR" >> "$GITHUB_ENV"
          g++ -std=c++17 -O1 -g -I"$ROOT_HOME/include" \
            validation/recheck_checksum_invariants.cxx -o recheck_checksum_invariants \
            -L"$ROOT_LIBDIR" -Wl,-rpath-link,"$ROOT_VENDOR_LIBDIR" \
            $(root-config --cflags --libs) -lROOTNTuple
      - name: Run all 12 isolated checksum/compression cases
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/root-invariant-recheck
          cd /tmp/root-invariant-recheck
          failures=0
          for id in $(seq 0 11); do
            echo "::group::Case $id"
            timeout 15s "$GITHUB_WORKSPACE/recheck_checksum_invariants" "$id"
            status=$?
            echo "Case $id status=$status"
            if [ "$status" -ne 0 ]; then failures=$((failures+1)); fi
            echo "::endgroup::"
          done
          echo "Failed cases: $failures/12"
          test "$failures" -eq 0
