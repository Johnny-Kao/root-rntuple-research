name: ROOT RNTuple numeric correctness research
on:
  workflow_dispatch:
  push:
    paths:
      - 'validation/**'
      - '.github/workflows/merge-correctness.yml'
permissions:
  contents: read
jobs:
  numeric-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ROOT binary
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: ROOT
          python -c 'import ROOT; print("ROOT",ROOT.gROOT.GetVersion())'
      - name: Compile test on GitHub runner (no local machine execution)
        shell: bash
        run: |
          set -euo pipefail
          ROOT_HOME="$(python -c 'import ROOT; from pathlib import Path; print(Path(ROOT.__file__).resolve().parent)')"
          ROOT_LIBDIR="$ROOT_HOME/lib"
          ROOT_VENDOR_LIBDIR="$ROOT_HOME/../root.libs"
          export PATH="$ROOT_HOME/bin:$PATH"
          echo "LD_LIBRARY_PATH=$ROOT_LIBDIR:$ROOT_VENDOR_LIBDIR:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          g++ -std=c++17 -O1 -g -I"$ROOT_HOME/include" \
            validation/merge_numeric_invariants.cxx -o merge_numeric_invariants \
            -L"$ROOT_LIBDIR" -Wl,-rpath-link,"$ROOT_VENDOR_LIBDIR" \
            $(root-config --cflags --libs) -lROOTNTuple
      - name: Generate valid ROOT files, merge and compare every row
        run: |
          mkdir -p /tmp/root-numeric-case
          cd /tmp/root-numeric-case
          "$GITHUB_WORKSPACE/merge_numeric_invariants"
