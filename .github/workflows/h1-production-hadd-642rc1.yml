name: H1 production hadd ROOT 6.42 RC1 public entry
on:
  workflow_dispatch:
  push:
    branches: [research/h1-checksum-patch-20261105]
permissions:
  contents: read
jobs:
  hadd-public-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official unmodified ROOT 6.42.00-rc1 Ubuntu binary and compile CLI harness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libtbb12 libgsl27 libpcre2-8-0 libxxhash0 liblz4-1 libzstd1 libfreetype6 > /tmp/h1-install.txt 2>&1 || true
          # CERN supports HTTP byte ranges. Fetch in 8 independent parts to avoid
          # previous single-stream 240-second timeouts, then verify gzip before use.
          URL='https://root.cern/download/root_v6.42.00-rc1.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz'
          TOTAL=397692613
          CHUNK=$(( (TOTAL+7)/8 ))
          mkdir -p /tmp/h1parts
          for n in {0..7}; do
            start=$((n*CHUNK))
            end=$((start+CHUNK-1))
            if [ "$end" -ge "$TOTAL" ]; then end=$((TOTAL-1)); fi
            (
              curl -fL --retry 2 --connect-timeout 25 --max-time 390 \
                --range "${start}-${end}" "$URL" -o "/tmp/h1parts/part${n}"
              test "$(stat -c %s "/tmp/h1parts/part${n}")" -eq "$((end-start+1))"
              echo "H1_BINARY_PART_${n}_PASS"
            ) &
          done
          wait
          cat /tmp/h1parts/part{0..7} > /tmp/official_root.tar.gz
          test "$(stat -c %s /tmp/official_root.tar.gz)" -eq "$TOTAL"
          gzip -t /tmp/official_root.tar.gz
          echo 'H1_BINARY_ARCHIVE_VERIFIED'
          echo 'H1_TESTING_OFFICIAL_UNMODIFIED_642_RC1'
          tar -xzf /tmp/official_root.tar.gz -C "$GITHUB_WORKSPACE"
          ROOT_HOME="$GITHUB_WORKSPACE/root"
          source "$ROOT_HOME/bin/thisroot.sh"
          echo "$ROOT_HOME/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$ROOT_HOME/lib" >> "$GITHUB_ENV"
          echo "ROOTSYS=$ROOT_HOME" >> "$GITHUB_ENV"
          root-config --version
          which hadd
          g++ -std=c++17 -O1 -I"$ROOT_HOME/include" validation/h1_hadd_cli.cxx -o h1_hadd_cli \
             -L"$ROOT_HOME/lib" $(root-config --cflags --libs) -lROOTNTuple
      - name: Exercise actual public hadd CLI, record corruption/crash/value mismatch
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p /tmp/h1-prod-hadd
          cd /tmp/h1-prod-hadd
          "$GITHUB_WORKSPACE/h1_hadd_cli" generate source_a.root 1 0 0
          "$GITHUB_WORKSPACE/h1_hadd_cli" generate source_b.root 2 1 505
          "$GITHUB_WORKSPACE/h1_hadd_cli" generate control_a.root 1 1 505
          "$GITHUB_WORKSPACE/h1_hadd_cli" generate control_b.root 2 1 505
          timeout 30s hadd -f505 control_merged.root control_a.root control_b.root > control_hadd.log 2>&1
          control_status=$?
          echo "H1_CONTROL_HADD_EXIT=$control_status"
          tail -15 control_hadd.log
          if [ "$control_status" -eq 0 ]; then "$GITHUB_WORKSPACE/h1_hadd_cli" control_merged.root; echo "H1_CONTROL_READ_EXIT=$?"; fi
          echo "H1_PRODUCTION_COMMAND=hadd -f505 merged.root source_a.root source_b.root"
          timeout 50s hadd -f505 merged.root source_a.root source_b.root > hadd.log 2>&1
          status=$?
          echo "H1_HADD_EXIT=$status"
          tail -45 hadd.log
          if [ -f merged.root ]; then
            echo "H1_OUTPUT_BYTES=$(stat -c %s merged.root)"
            "$GITHUB_WORKSPACE/h1_hadd_cli" merged.root
            read_status=$?
            echo "H1_READBACK_EXIT=$read_status"
          else
            echo "H1_OUTPUT_ABSENT"
            read_status=88
          fi
          if [ "$status" -ne 0 ] || [ "$read_status" -ne 0 ]; then
            echo "H1_PRODUCTION_FAILURE_REPRODUCED"
          else
            echo "H1_PRODUCTION_PASS"
          fi
          echo "H1_FACTORIZATION_START"
          "$GITHUB_WORKSPACE/h1_hadd_cli" generate a_off_same.root 1 0 505
          "$GITHUB_WORKSPACE/h1_hadd_cli" generate a_on_diff.root 1 1 0
          "$GITHUB_WORKSPACE/h1_hadd_cli" generate b_off_same.root 2 0 505
          for spec in "mixed_equal a_off_same.root source_b.root" "all_off a_off_same.root b_off_same.root" "all_on_diff a_on_diff.root source_b.root"; do
            set -- $spec
            label=$1; a=$2; b=$3
            timeout 30s hadd -f505 "${label}.root" "$a" "$b" > "${label}.log" 2>&1
            code=$?
            echo "H1_MATRIX_${label}_EXIT=$code"
            grep -E 'Fatal:|Assertion|Warning in|Error in' "${label}.log" | tail -8 || true
            if [ "$code" -eq 0 ]; then
              "$GITHUB_WORKSPACE/h1_hadd_cli" "${label}.root"
              echo "H1_MATRIX_${label}_READ=$?"
            else
              echo "H1_MATRIX_${label}_SKIP_READ"
            fi
          done
          echo "H1_FACTORIZATION_END"
          test "$status" -eq 0 && test "$read_status" -eq 0
