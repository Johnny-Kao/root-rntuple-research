name: ROOT P1 staging patch applicability check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify PR-ready bundle applies to current upstream
        shell: bash
        run: |
          set -euo pipefail
          git init root-src
          git -C root-src remote add origin https://github.com/root-project/root.git
          git -C root-src fetch --depth=1 origin 6a167d36491cc92be9da91387312b0eed44b7095
          git -C root-src checkout --detach FETCH_HEAD
          git -C root-src apply --check "$GITHUB_WORKSPACE/staging/P1_PR_READY.patch"
          git -C root-src apply "$GITHUB_WORKSPACE/staging/P1_PR_READY.patch"
          git -C root-src diff --check
          test "$(git -C root-src diff --name-only | wc -l)" -eq 2
          git -C root-src diff --stat
          echo "UPSTREAM_SOURCE_SHA=$(git -C root-src rev-parse HEAD)"
