name: ROOT P1 master source regression (research only)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p1-master-source.yml'
      - 'validation/**'
permissions:
  contents: read
jobs:
  p1-master:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential ninja-build cmake python3 git libssl-dev zlib1g-dev liblzma-dev libzstd-dev liblz4-dev libxxhash-dev libpcre2-dev libtbb-dev nlohmann-json3-dev libfreetype-dev
      - name: Fetch exact upstream master source SHA (read only)
        shell: bash
        run: |
          set -euo pipefail
          git init root-src
          git -C root-src remote add origin https://github.com/root-project/root.git
          git -C root-src fetch --depth=1 origin 5281bc2342c5cba711cb507f4ef53c623ba4f942
          git -C root-src checkout --detach FETCH_HEAD
          echo "ROOT_SOURCE_SHA=$(git -C root-src rev-parse HEAD)" | tee -a "$GITHUB_ENV"
      - name: Configure and compile ROOT master
        shell: bash
        run: |
          set -euo pipefail
          cmake -S root-src -B root-build -G Ninja -Dminimal=ON -Droot7=ON -Dtesting=OFF -Dfail-on-missing=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build root-build --parallel 2
      - name: Compile P1 independent matrix against built ROOT
        shell: bash
        run: |
          set -euo pipefail
          source root-build/bin/thisroot.sh
          echo "ROOT version: $(root-config --version)"
          echo "SOURCE SHA: $ROOT_SOURCE_SHA"
          g++ -std=c++17 -O1 -g -I"$ROOTSYS/include" validation/recheck_checksum_invariants.cxx -o /tmp/p1-master-matrix $(root-config --cflags --libs) -lROOTNTuple
      - name: Execute full 12 case matrix in isolated processes
        shell: bash
        run: |
          set -uo pipefail
          source root-build/bin/thisroot.sh
          mkdir -p "$GITHUB_WORKSPACE/p1-results"
          cd "$GITHUB_WORKSPACE/p1-results"
          failures=0
          for id in $(seq 0 11); do
            echo "::group::P1 matrix case $id"
            if timeout 25s /tmp/p1-master-matrix "$id" >"case-$id.log" 2>&1; then status=0; else status=$?; fi
            cat "case-$id.log"
            echo "CASE $id STATUS $status"
            echo "$id,$status" >> results.csv
            [ "$status" -eq 0 ] || failures=$((failures+1))
            echo "::endgroup::"
          done
          echo "ROOT_SOURCE_SHA=$ROOT_SOURCE_SHA"
          echo "FAILED=$failures / 12"
          test "$failures" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-p1-source-matrix
          path: p1-results/
          if-no-files-found: ignore
