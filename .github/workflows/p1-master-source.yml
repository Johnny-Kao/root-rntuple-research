name: ROOT P1 master source regression (research only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore existing compiled ROOTNTuple
        uses: actions/cache/restore@v4
        id: built-root
        with:
          path: root-build
          key: rootntuple-5281bc2342c5-release-minimal-nocurl-v1
          fail-on-cache-miss: true
      - name: Install required system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build cmake libssl-dev zlib1g-dev liblzma-dev libzstd-dev liblz4-dev libxxhash-dev libpcre2-dev libtbb-dev nlohmann-json3-dev libfreetype-dev
      - name: Fetch exact unchanged ROOT upstream source
        shell: bash
        run: |
          set -euo pipefail
          git init root-src
          git -C root-src remote add origin https://github.com/root-project/root.git
          git -C root-src fetch --depth=1 origin 5281bc2342c5cba711cb507f4ef53c623ba4f942
          git -C root-src checkout --detach FETCH_HEAD
          git -C root-src apply --check "$GITHUB_WORKSPACE/patches/p1-source-checksum.patch"
          echo "ROOT_SOURCE_SHA=$(git -C root-src rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Compile independent and public-path test drivers
        shell: bash
        run: |
          set -euo pipefail
          source root-build/bin/thisroot.sh
          read -r -a root_cflags <<< "$(root-config --cflags)"
          for lib in ROOTNTuple RIO Core; do
            test -f "$ROOTSYS/lib/lib${lib}.so"
          done
          g++ "${root_cflags[@]}" -std=c++17 -O1 -g -I"$ROOTSYS/include" \
            validation/recheck_checksum_invariants.cxx \
            -L"$ROOTSYS/lib" -Wl,-rpath,"$ROOTSYS/lib" \
            -lROOTNTuple -lRIO -lCore -o /tmp/p1-matrix
          g++ "${root_cflags[@]}" -std=c++17 -O1 -g -I"$ROOTSYS/include" \
            validation/p1_tfilemerger_public.cxx \
            -L"$ROOTSYS/lib" -Wl,-rpath,"$ROOTSYS/lib" \
            -lROOTNTuple -lRIO -lCore -o /tmp/p1-public
      - name: Baseline reproduce on original upstream binary
        shell: bash
        run: |
          set -uo pipefail
          source root-build/bin/thisroot.sh
          mkdir -p "$GITHUB_WORKSPACE/p1-results/baseline"
          cd "$GITHUB_WORKSPACE/p1-results/baseline"
          for id in $(seq 0 11); do
            if timeout 15s /tmp/p1-matrix "$id" >"case-$id.log" 2>&1; then status=0; else status=$?; fi
            echo "$id,$status" | tee -a matrix.csv
          done
          if timeout 20s /tmp/p1-public public >public.log 2>&1; then status=0; else status=$?; fi
          echo "public,$status" | tee -a matrix.csv
          cat public.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-p1-public-baseline
          path: p1-results/baseline/
          if-no-files-found: ignore
      - name: Apply minimal patch and rebuild only changed ROOTNTuple object
        shell: bash
        run: |
          set -euo pipefail
          # The compiled cache was produced from the same pinned source SHA.
          # Fresh git checkout timestamps must not invalidate all cached objects.
          find root-src -path root-src/.git -prune -o -type f -exec touch -t 202001010000 {} +
          git -C root-src apply "$GITHUB_WORKSPACE/patches/p1-source-checksum.patch"
          git -C root-src diff --check
          # Fail before an expensive rebuild if cache is stale for other reasons.
          ninja -C root-build -n ROOTNTuple | tee /tmp/root-p1-build-plan.txt
          build_count=$(grep -c '^\[' /tmp/root-p1-build-plan.txt || true)
          echo "PLANNED_BUILD_ACTIONS=$build_count"
          test "$build_count" -gt 0
          test "$build_count" -le 50
          cmake --build root-build --target ROOTNTuple --parallel 4
          git -C root-src diff --stat
      - name: Repeat same matrix with patched ROOTNTuple
        shell: bash
        run: |
          set -uo pipefail
          source root-build/bin/thisroot.sh
          mkdir -p "$GITHUB_WORKSPACE/p1-results/patched"
          cd "$GITHUB_WORKSPACE/p1-results/patched"
          failures=0
          for id in $(seq 0 11); do
            if timeout 15s /tmp/p1-matrix "$id" >"case-$id.log" 2>&1; then status=0; else status=$?; fi
            echo "$id,$status" | tee -a matrix.csv
            if [ "$status" -ne 0 ]; then failures=$((failures+1)); cat "case-$id.log"; fi
          done
          if timeout 20s /tmp/p1-public public >public.log 2>&1; then status=0; else status=$?; fi
          echo "public,$status" | tee -a matrix.csv
          cat public.log
          if [ "$status" -ne 0 ]; then failures=$((failures+1)); fi
          echo "PATCHED_FAILURES=$failures"
          test "$failures" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-p1-baseline-patched-comparison
          path: p1-results/
          if-no-files-found: ignore
