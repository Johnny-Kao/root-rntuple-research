name: ROOT H1 patch apply gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: root-project/root
          ref: 916c66b5933cfab7112e96c7839c3be1a4bfb095
          path: root-src
          persist-credentials: false
          sparse-checkout: |
            tree/ntuple/src/RNTupleMerger.cxx
          sparse-checkout-cone-mode: false
      - name: Apply H1 source patch and check whitespace
        shell: bash
        run: |
          set -euo pipefail
          cd root-src
          git apply --check ../research/patches/h1-output-checksum-consistency.patch
          git apply ../research/patches/h1-output-checksum-consistency.patch
          git diff --check
          git diff --stat
          python3 - <<'PY'
          from pathlib import Path
          src=Path("tree/ntuple/src/RNTupleMerger.cxx").read_text()
          assert "const auto dstChecksumSize =" in src
          assert "const auto bufSize = uncompressedSize + dstChecksumSize;" in src
          assert "fWriteOpts.GetEnablePageChecksums()};" in src
          assert "fSealedPage.VerifyChecksumIfEnabled().ThrowOnError();" in src
          print("H1_PATCH_APPLY_AND_CONTRACT_CHECK_PASS")
          PY
