name: ROOT H1 patched runtime comparison
on:
  workflow_dispatch:
  push:
    branches:
      - research/h1-checksum-patch-20261105
permissions:
  contents: read
jobs:
  patched-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install binary ROOT 6.40
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check ROOT==0.1a12
          python -c 'import ROOT; assert ROOT.gROOT.GetVersion().startswith("6.40."); print("ROOT",ROOT.gROOT.GetVersion())'
      - name: Prepare same-version patched merger translation unit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/tree/ntuple/src
          curl -fsSL --retry 2 --max-time 40 https://raw.githubusercontent.com/root-project/root/v6-40-00/tree/ntuple/src/RNTupleMerger.cxx -o source/tree/ntuple/src/RNTupleMerger.cxx
          cd source
          git apply --check ../patches/h1-root-v6-40-00.patch
          git apply ../patches/h1-root-v6-40-00.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tree/ntuple/src/RNTupleMerger.cxx")
          s = p.read_text()
          s = s.replace("#include <algorithm>", "#include <algorithm>\n#include <cstdio>")
          s = s.replace("      assert(fBufSize >= bytesPacked + checksumSize);", """      std::fprintf(stderr, "H1TRACE func packed=%zu buf=%zu ck=%zu sourceCk=%d destCk=%d elems=%zu\\n", size_t(bytesPacked), size_t(fBufSize), size_t(checksumSize), int(fSealedPage.GetHasChecksum()), int(fWriteOpts.GetEnablePageChecksums()), size_t(fSealedPage.GetNElements()));
      assert(fBufSize >= bytesPacked + checksumSize);""")
          s = s.replace("            const auto bufSize = uncompressedSize + dstChecksumSize;", """            const auto bufSize = uncompressedSize + dstChecksumSize;
            std::fprintf(stderr, "H1TRACE alloc uncomp=%zu packed=%zu buf=%zu dstCk=%d sourceCk=%d\\n", size_t(uncompressedSize), size_t(srcColElement->GetPackedSize(sealedPage.GetNElements())), size_t(bufSize), int(mergeData.fDestination.GetWriteOptions().GetEnablePageChecksums()), int(sealedPage.GetHasChecksum()));""")
          p.write_text(s)
          PY
          echo H1_PATCH_WITH_DIAGNOSTICS_APPLIED
      - name: Compile patched merger only, not LLVM or ROOT
        shell: bash
        run: |
          set -euo pipefail
          ROOT_HOME="$(python -c 'import ROOT; from pathlib import Path; print(Path(ROOT.__file__).resolve().parent)')"
          export PATH="$ROOT_HOME/bin:$PATH"
          echo "LD_LIBRARY_PATH=$ROOT_HOME/lib:$ROOT_HOME/../root.libs" >> "$GITHUB_ENV"
          g++ -std=c++17 -O1 -g -fPIC -I"$ROOT_HOME/include" \
             $(root-config --cflags) -c source/tree/ntuple/src/RNTupleMerger.cxx -o rntuple_merger_patched.o
          g++ -std=c++17 -O1 -g -I"$ROOT_HOME/include" \
             validation/recheck_checksum_invariants.cxx rntuple_merger_patched.o \
             -o h1_patched_runtime \
             -Wl,--export-dynamic -L"$ROOT_HOME/lib" -Wl,-rpath-link,"$ROOT_HOME/../root.libs" \
             $(root-config --cflags --libs) -lROOTNTuple
          nm -C h1_patched_runtime | grep -m 1 'RNTupleMerger::Merge('
      - name: Run all H1 control and affected cases with patched object
        shell: bash
        run: |
          set +e
          set -u
          mkdir -p /tmp/h1-patched-runtime
          cd /tmp/h1-patched-runtime
          fails=0
          for id in 2 3 4; do
            echo "::group::PATCHED_CASE_$id"
            timeout 20s "$GITHUB_WORKSPACE/h1_patched_runtime" "$id"
            status=$?
            echo "PATCHED_CASE_$id=$status"
            if [ "$status" -ne 0 ]; then fails=$((fails+1)); fi
            echo "::endgroup::"
          done
          echo "PATCHED_FAILURES=$fails"
          test "$fails" -eq 0
