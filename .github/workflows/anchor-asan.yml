name: ROOT H1 fast prebuilt regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  h1-prebuilt:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install prebuilt ROOT
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: ROOT
          python -c 'import ROOT; print("ROOT_RUNTIME_VERSION", ROOT.gROOT.GetVersion())'
      - name: Build H1 reproducer only
        shell: bash
        run: |
          set -euo pipefail
          ROOT_HOME="$(python -c 'import ROOT; from pathlib import Path; print(Path(ROOT.__file__).resolve().parent)')"
          export PATH="$ROOT_HOME/bin:$PATH"
          echo "LD_LIBRARY_PATH=$ROOT_HOME/lib:$ROOT_HOME/../root.libs" >> "$GITHUB_ENV"
          g++ -std=c++17 -O1 -g -I"$ROOT_HOME/include" \
            validation/recheck_checksum_invariants.cxx -o h1_reproducer \
            -L"$ROOT_HOME/lib" -Wl,-rpath-link,"$ROOT_HOME/../root.libs" \
            $(root-config --cflags --libs) -lROOTNTuple
      - name: H1 cases and independent readback
        shell: bash
        run: |
          set +e
          set -u
          mkdir -p /tmp/h1-fast
          cd /tmp/h1-fast
          for id in 0 1 2 3 4 5 6 7 10 11; do
            echo "::group::H1_CASE_$id"
            timeout 15s "$GITHUB_WORKSPACE/h1_reproducer" "$id"
            status=$?
            echo "H1_CASE_$id=$status"
            echo "::endgroup::"
          done
          echo "NOTE: A nonzero case result is research evidence, not workflow-infrastructure failure"
